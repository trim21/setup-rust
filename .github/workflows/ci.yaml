name: build-test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  cancel-in-progress: true
  group: "${{ github.workflow }}-${{ github.ref }}"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: pnpm/action-setup@v6.1.0
      - name: Setup node
        uses: actions/setup-node@v6.5.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm i

      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run build

  rust-toolchain-toml:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm i
      - run: pnpm run build

      - uses: ./
        id: setup
        with:
          working-directory: tests/sample
          components: clippy

      - name: Verify installed toolchain and extra component
        shell: bash
        run: |
          rustc --version
          cargo clippy --version
          [[ "${{ steps.setup.outputs.toolchain }}" == "stable" ]]

      - name: Build test project
        run: cargo build
        working-directory: tests/sample

  rust-toolchain-toml-checks:
    needs: [rust-toolchain-toml]
    runs-on: ubuntu-slim
    steps:
      - run: echo "all rust-toolchain-toml checks passed"

  explicit-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm i
      - run: pnpm run build

      - uses: ./
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Verify extra target
        shell: bash
        run: rustup target list --installed | grep -q wasm32-unknown-unknown

  beancount-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/checkout@v6.1.0
        with:
          repository: trim21/beancount-format
          path: beancount-format

      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm i
      - run: pnpm run build

      - uses: ./
        id: setup
        with:
          working-directory: beancount-format

      - name: Verify toolchain from beancount-format's rust-toolchain.toml
        shell: bash
        run: |
          rustc --version
          [[ "${{ steps.setup.outputs.toolchain }}" == "1.98.1" ]]

      - run: cargo check --locked
        working-directory: beancount-format
